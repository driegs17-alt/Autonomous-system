<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undercurrent — generative p5.js</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
</head>
<body>
  <main>
    <div id="stage"></div>
    <p class="controls">
      <span><kbd>move</kbd> whirlpool</span>
      <span><kbd>drag</kbd> pour ink</span>
      <span><kbd>click</kbd> new drawing</span>
      <span><kbd>G</kbd> flow / grid</span>
      <span><kbd>R</kbd> replay seed</span>
      <span><kbd>S</kbd> save PNG</span>
      <span><kbd>space</kbd> pause</span>
    </p>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
